<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたのGemをSkills化しませんか？｜メールで事前登録</title>
<meta name="description" content="たくさんあるGemを、AIに投げるだけでスキル化してくれるスキルを作っています。メールの事前登録で、発売時に500円クーポンをお届けします。">
<meta property="og:title" content="あなたのGemをSkills化しませんか？">
<meta property="og:description" content="Gemを、AIに投げるだけでスキル化。メール事前登録で500円クーポン。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pop7237radio-hue.github.io/ei-site/gem-skill/mail/">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #1a1a2e;
    background: #fafafa;
    line-height: 1.9;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 560px; width: 100%; text-align: center; }
  h1 {
    font-size: clamp(1.5rem, 5.5vw, 2.1rem);
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  p { font-size: 1.02rem; margin-bottom: 14px; text-align: left; }
  .price { font-weight: 700; }
  form { margin: 28px auto 12px; max-width: 400px; text-align: left; }
  label { font-size: .9rem; font-weight: 700; display: block; margin-bottom: 6px; }
  input[type="email"] {
    width: 100%;
    font-size: 1.05rem;
    padding: 13px 16px;
    border: 1.5px solid #d4d4dd;
    border-radius: 12px;
    background: #fff;
    margin-bottom: 14px;
  }
  input[type="email"]:focus { outline: none; border-color: #2563eb; }
  .cf-turnstile { margin-bottom: 14px; }
  button[type="submit"] {
    display: block;
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: inherit;
    padding: 16px 24px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .35);
  }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled { opacity: .6; cursor: default; }
  #rondo-status { text-align: center; font-size: .95rem; margin-top: 12px; min-height: 1.5em; }
  .note { font-size: .8rem; color: #888; }
  .alt { font-size: .85rem; color: #666; margin-top: 20px; text-align: center; }
  .alt a { color: #06C755; font-weight: 700; }
  footer { margin-top: 40px; font-size: .78rem; color: #aaa; }
  footer a { color: #aaa; }
</style>
</head>
<body>
<main>
  <h1>あなたのGemを<br>Skills化しませんか？</h1>
  <p>たくさんあるGemを、AIに投げるだけでスキル化してくれるスキルを作っています。</p>
  <p><span class="price">値段は980円。</span>事前登録で500円クーポンをお渡しします（980円 → 480円）。</p>
  <p>発売日が決まったら、このメールで最初にお知らせします。発売までのあいだ、制作の裏側の話が2通だけ届きます。売り込みのメールは送りません。</p>
  <form id="rondo-subscribe">
    <label for="rondo-email">メールアドレス</label>
    <input
      id="rondo-email"
      name="email"
      type="email"
      inputmode="email"
      autocomplete="email"
      spellcheck="false"
      placeholder="you@example.com"
      required
    >
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEPb5yXZwWeoa-W4"></div>
    <div aria-hidden="true" style="position:absolute;left:-10000px">
      <label for="rondo-website">Website</label>
      <input id="rondo-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit">登録確認メールを受け取る</button>
    <p id="rondo-status" role="status" aria-live="polite"></p>
  </form>
  <p class="note" style="text-align:center;">届いた確認メールのリンクを押すと登録完了です。<br>解除はメール内のリンクからいつでもできます。</p>
  <p class="alt">LINE派の方はこちら → <a href="https://lin.ee/P5qMYBk">LINEで事前登録する</a></p>
  <footer><a href="https://x.com/siroradio51">えい｜倒れないための自動化</a></footer>
</main>
<script>
  (() => {
    const form = document.getElementById('rondo-subscribe');
    const status = document.getElementById('rondo-status');
    const button = form.querySelector('button[type="submit"]');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const cfToken = data.get('cf-turnstile-response');
      if (!cfToken) {
        status.textContent = 'bot確認を完了してから、もう一度お試しください。';
        return;
      }
      button.disabled = true;
      button.textContent = '送信中…';
      status.textContent = '';
      try {
        const response = await fetch('https://rondo.pop7237radio.workers.dev/api/subscribe', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            email: data.get('email'),
            website: data.get('website'),
            cfToken,
            source: 'web',
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        form.reset();
        if (window.turnstile) window.turnstile.reset();
        status.textContent = '確認メールを送りました。受信箱のリンクを開いて登録を完了してください。';
      } catch {
        status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
        if (window.turnstile) window.turnstile.reset();
      } finally {
        button.disabled = false;
        button.textContent = '登録確認メールを受け取る';
      }
    });
  })();
</script>
</body>
</html>
